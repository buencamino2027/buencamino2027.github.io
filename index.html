      var m = L.marker([p.lat, p.lon], { icon: icon, title: p.nombre, keyboard: true }).addTo(realMap);
      m.bindPopup((pic ? '<img src="' + pic + '" alt="">' : "") + "<b>" + esc(p.nombre) + "</b>" + info + '<br><a href="' + mapsSearch(p.nombre + ", Galicia") + '" target="_blank" rel="noopener">Abrir en Google Maps</a>');
      var down = { "Sarria": 1, "Palas de Rei": 1, "O Pedrouzo": 1, "Santiago": 1 }[p.nombre];
      if (p.tipo !== "paso") m.bindTooltip(p.nombre, { permanent: true, direction: down ? "bottom" : "top", offset: down ? [0, p.tipo === "meta" ? 26 : 12] : [0, -12], className: "mlabel" });
    });
    var bounds = L.latLngBounds(ll).pad(0.04);
    realMap.fitBounds(bounds, { paddingTopLeft: [36, 10], paddingBottomRight: [22, 10] });
    realMap.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    setTimeout(function () { realMap.invalidateSize(); realMap.fitBounds(bounds, { paddingTopLeft: [36, 10], paddingBottomRight: [22, 10] }); }, 250);
  }

  // ---------- personas, perfil y registro ----------
  var PEOPLE = ["Sandra", "Ana", "Javi", "Fran", "Marina", "Janina", "Jorge", "Marta", "Pablo", "Álvaro", "Alberto"];
  function slug(n) { return String(n).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, ""); }
  function avatar(n) { return photo("av-" + slug(n)); }
  function avImg(n, cls) { var a = avatar(n); return a ? '<img class="' + (cls || "av-mini") + '" src="' + a + '" alt="">' : ""; }
  function me() { return store("camino-perfil"); }
  function route(dir) {
    var pf = me(); if (!pf || !T.rutas) return {};
    var city = dir === "ida" ? pf.sale : pf.vuelve;
    if (T.rutas[city]) return T.rutas[city][dir] || {};
    var code = city.normalize("NFD").replace(/[̀-ͯ]/g, "").slice(0, 3).toUpperCase();
    return dir === "ida" ? { tipo: "Avión", origen: city, origenCod: code, destino: "Santiago", destinoCod: "SCQ", sale: "", notas: "Desde " + city + " hasta Galicia: rellena tu billete." }
                         : { tipo: "Avión", origen: "Santiago", origenCod: "SCQ", destino: city, destinoCod: code, sale: "", notas: "Vuelta a " + city + " el domingo 28." };
  }
  function adaptDay(d) {
    var pf = me(); if (!pf) return d;
    var c = JSON.parse(JSON.stringify(d));
    function via(city) { return T.rutas && T.rutas[city] && T.rutas[city].ida.tipo === "Tren" ? "Tren" : "Vuelo"; }
    if (c.fecha === T.viaje.inicio) {
      c.puntos[0] = via(pf.sale) + " desde " + pf.sale;
      c.horario = (c.horario || []).filter(function (h) {
        if (/Madrid/.test(h.texto)) return pf.sale === "Madrid";
        if (/Málaga/.test(h.texto)) return pf.sale === "Málaga";
        return true;
      });
      if (pf.sale !== "Madrid" && pf.sale !== "Málaga") c.horario.unshift({ hora: "Tarde", texto: "Viaje desde " + pf.sale + " hasta Sarria" });
    }
    if (c.fecha === T.viaje.fin) {
      c.puntos[c.puntos.length - 1] = "Vuelta a " + pf.vuelve;
      c.horario = (c.horario || []).map(function (h) {
        if (/[Vv]uelo de vuelta/.test(h.texto) && pf.vuelve !== "Málaga") return { hora: "Tarde", texto: (via(pf.vuelve) === "Tren" ? "Tren" : "Viaje") + " de vuelta a " + pf.vuelve };
        return h;
      });
    }
    return c;
  }
  function renameTu(name) {
    var l = store("camino-gastos2"); if (!l) return;
    var ch = false;
    l.forEach(function (g) { if (g.pagador === "Tú") { g.pagador = name; ch = true; } g.entre = (g.entre || []).map(function (p) { if (p === "Tú") { ch = true; return name; } return p; }); });
    if (ch) store("camino-gastos2", l);
  }
  var onbDone = null;
  function openOnboarding(cb) {
    onbDone = cb || null;
    var onb = $("onb"), pf = me() || {}, chosen = pf.nombre || null;
    var CITIES = ["Málaga", "Madrid"];
    $("onb-grid").innerHTML = PEOPLE.map(function (n) { return '<button class="onb-av" type="button" data-who="' + esc(n) + '">' + avImg(n, "") + "<span>" + esc(n) + "</span></button>"; }).join("");
    function chips(id, name, val, extra) {
      var opts = (extra ? [extra] : []).concat(CITIES).concat(["Otra"]);
      var cur = val == null ? (extra ? extra : "") : (CITIES.indexOf(val) > -1 ? val : val ? "Otra" : "");
      $(id).innerHTML = opts.map(function (o, i) { return '<label class="pchip"><input type="radio" name="' + name + '" id="' + name + i + '" value="' + esc(o) + '"' + (o === cur ? " checked" : "") + "><span>" + esc(o) + "</span></label>"; }).join("");
    }
    function step(n) { $("onb-1").hidden = n !== 1; $("onb-2").hidden = n !== 2; onb.scrollTop = 0; }
    function sync() {
      var s1 = onb.querySelector('input[name="sale"]:checked'), s2 = onb.querySelector('input[name="vuelve"]:checked');
      $("onb-sale-otro").hidden = !(s1 && s1.value === "Otra");
      $("onb-vuelve-otro").hidden = !(s2 && s2.value === "Otra");
    }
    function toStep2(n) {
      chosen = n;
      $("onb-me").src = avatar(n); $("onb-hola").textContent = "hola, " + n.toLowerCase();
      var same = pf.vuelve && pf.vuelve === pf.sale;
      chips("onb-sale", "sale", pf.nombre === n ? pf.sale : null);
      chips("onb-vuelve", "vuelve", pf.nombre === n ? (same ? "Igual que la ida" : pf.vuelve) : null, "Igual que la ida");
      $("onb-sale-otro").value = pf.nombre === n && CITIES.indexOf(pf.sale) < 0 ? pf.sale || "" : "";
      $("onb-vuelve-otro").value = pf.nombre === n && !same && CITIES.indexOf(pf.vuelve) < 0 ? pf.vuelve || "" : "";
      sync(); step(2);
    }
    onb.querySelectorAll("[data-who]").forEach(function (b) { b.onclick = function () { toStep2(b.getAttribute("data-who")); }; });
    onb.onchange = sync;
    $("onb-back").onclick = function () { step(1); };
    $("onb-go").onclick = function () {
      var s1 = onb.querySelector('input[name="sale"]:checked'), s2 = onb.querySelector('input[name="vuelve"]:checked');
      if (!s1) { toast("Elige desde dónde sales"); return; }
      var sale = s1.value === "Otra" ? $("onb-sale-otro").value.trim() : s1.value;
      if (!sale) { toast("Escribe tu ciudad de salida"); $("onb-sale-otro").focus(); return; }
      var vuelve = !s2 || s2.value === "Igual que la ida" ? sale : s2.value === "Otra" ? $("onb-vuelve-otro").value.trim() : s2.value;
      if (!vuelve) { toast("Escribe a dónde vuelves"); $("onb-vuelve-otro").focus(); return; }
      store("camino-perfil", { nombre: chosen, sale: sale, vuelve: vuelve });
      store("camino-yo", chosen); renameTu(chosen);
      onb.hidden = true;
      if (T) { renderItinerario(); renderDocumentos(); }
      toast("¡Bo Camiño, " + chosen + "!");
      if (onbDone) onbDone();
    };
    if (chosen && pf.nombre) toStep2(chosen); else step(1);
    onb.hidden = false;
  }

  // ---------- burbujas que rebotan ----------
  function initBubbles(splash) {
    var box = $("bubbles"); if (!box) return;
    var W = splash.clientWidth, H = splash.clientHeight;
    var size = Math.round(Math.max(30, Math.min(42, W * .1)));
    box.style.setProperty("--bub", size + "px");
    var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var r = size / 2, rnd = rng(31);
    var B = PEOPLE.map(function (n, i) {
      var el = document.createElement("button");
      el.type = "button"; el.className = "bub"; el.setAttribute("aria-label", n);
      el.innerHTML = '<img src="' + avatar(n) + '" alt="">';
      box.appendChild(el);
      var ang = rnd() * Math.PI * 2, sp = 26 + rnd() * 30;
      return { el: el, x: r + rnd() * (W - size), y: r + (i / PEOPLE.length) * (H - size), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, drag: null };
    });
    function place(b) { b.el.style.transform = "translate3d(" + (b.x - r).toFixed(1) + "px," + (b.y - r).toFixed(1) + "px,0)"; }
    B.forEach(place);
    B.forEach(function (b) {
      b.el.addEventListener("pointerdown", function (e) {
        e.stopPropagation(); e.preventDefault();
        try { b.el.setPointerCapture(e.pointerId); } catch (x) {}
        b.drag = { sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, lt: e.timeStamp, moved: false, vx: 0, vy: 0 };
        b.el.classList.add("pop");
      });
      b.el.addEventListener("pointermove", function (e) {
        if (!b.drag) return; e.stopPropagation();
        var d = b.drag, dt = Math.max(1, e.timeStamp - d.lt);
        if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 5) d.moved = true;
        d.vx = (e.clientX - d.lx) / dt * 1000; d.vy = (e.clientY - d.ly) / dt * 1000;
        b.x += e.clientX - d.lx; b.y += e.clientY - d.ly; d.lx = e.clientX; d.ly = e.clientY; d.lt = e.timeStamp;
        place(b);
      });
      function up(e) {
        if (!b.drag) return; e.stopPropagation();
        var d = b.drag; b.drag = null; b.el.classList.remove("pop");
        if (d.moved) { var cap = 1100, m = Math.hypot(d.vx, d.vy), k = m > cap ? cap / m : 1; b.vx = d.vx * k; b.vy = d.vy * k; }
        else { var a = -Math.PI / 2 + (Math.random() - .5) * 1.6, sp = 380 + Math.random() * 220; b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; }
        if (still) { b.vx = b.vy = 0; }
      }
      b.el.addEventListener("pointerup", up); b.el.addEventListener("pointercancel", up);
      b.el.addEventListener("click", function (e) { e.stopPropagation(); });
    });
    if (still) return;
    var last = performance.now();
    function tick(now) {
      if (splash.hidden) return;
      var dt = Math.min(.04, (now - last) / 1000); last = now;
      W = splash.clientWidth; H = splash.clientHeight;
      B.forEach(function (b) {
        if (b.drag) return;
        b.x += b.vx * dt; b.y += b.vy * dt;
        var sp = Math.hypot(b.vx, b.vy);
        if (sp > 60) { var f = Math.pow(.6, dt); b.vx *= f; b.vy *= f; }
        else if (sp < 22) { var k2 = 1 + dt; b.vx = (b.vx || 10) * k2; b.vy = (b.vy || -10) * k2; }
        if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx); } else if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx); }
        if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy); } else if (b.y > H - r) { b.y = H - r; b.vy = -Math.abs(b.vy); }
      });
      for (var i = 0; i < B.length; i++) for (var j = i + 1; j < B.length; j++) {
        var a = B[i], c = B[j], dx = c.x - a.x, dy = c.y - a.y, dist = Math.hypot(dx, dy);
        if (dist > 0 && dist < size) {
          var nx = dx / dist, ny = dy / dist, ov = (size - dist) / 2;
          if (!a.drag) { a.x -= nx * ov; a.y -= ny * ov; } if (!c.drag) { c.x += nx * ov; c.y += ny * ov; }
          var rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (rv < 0) { if (!a.drag) { a.vx += rv * nx; a.vy += rv * ny; } if (!c.drag) { c.vx -= rv * nx; c.vy -= rv * ny; } }
        }
      }
      B.forEach(place);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ---------- pantalla de entrada ----------
  function initSplash() {
    var splash = $("splash"), knob = $("knob"), track = $("track"), center = splash.querySelector(".splash-center"), root = document.documentElement;
    root.classList.add("locked");
    var startY = null, dy = 0, moved = false, max = 0, lastY = 0, lastT = 0, vel = 0;
    function enter() {
      splash.classList.add("out"); root.classList.remove("locked"); setTimeout(function () { splash.hidden = true; }, 700);
      if (!me()) setTimeout(function () { if (T) openOnboarding(); else window.__needOnb = true; }, 420);
    }
    function setPos(p) { knob.style.transform = "translateY(" + p + "px)"; center.style.transform = "translateY(" + (p * .18) + "px)"; }
    splash.addEventListener("pointerdown", function (e) {
      max = track.clientHeight - knob.offsetHeight - 14; startY = lastY = e.clientY; lastT = e.timeStamp; dy = 0; moved = false; vel = 0;
      knob.style.transition = "none"; center.style.transition = "none";
      try { splash.setPointerCapture(e.pointerId); } catch (err) {}
    });
    splash.addEventListener("pointermove", function (e) {
      if (startY === null) return;
      dy = Math.max(-max, Math.min(0, e.clientY - startY)); if (Math.abs(e.clientY - startY) > 6) moved = true;
      var dt = e.timeStamp - lastT; if (dt > 0) vel = (e.clientY - lastY) / dt; lastY = e.clientY; lastT = e.timeStamp; setPos(dy);
    });
    function release() {
      if (startY === null) return; startY = null; knob.style.transition = ""; center.style.transition = "";
      if (moved && (-dy > max * .6 || vel < -0.9)) { setPos(-max); enter(); } else setPos(0);
    }
    splash.addEventListener("pointerup", release); splash.addEventListener("pointercancel", release);
    knob.addEventListener("click", function (e) { if (e.detail === 0) { enter(); return; } if (!moved) { track.classList.remove("nudge"); void track.offsetWidth; track.classList.add("nudge"); } });
    knob.addEventListener("keydown", function (e) { if (e.key === "ArrowUp") { e.preventDefault(); enter(); } });
    knob.focus({ preventScroll: true });
    requestAnimationFrame(function () { initBubbles(splash); });
  }

  // ---------- pestañas ----------
  var TABS = ["itinerario", "documentos", "emergencias", "mapa", "juegos"];
  function showTab(name, push) {
    if (TABS.indexOf(name) === -1) name = "itinerario";
    document.querySelectorAll("[data-panel]").forEach(function (p) { p.hidden = p.getAttribute("data-panel") !== name; });
    document.querySelectorAll("[data-tab]").forEach(function (t) { t.setAttribute("aria-selected", String(t.getAttribute("data-tab") === name)); });
    store("camino-tab", name);
    if (name === "mapa") setTimeout(initRealMap, 30);
    if (push) { try { history.replaceState(null, "", "#" + name); } catch (e) {} window.scrollTo(0, 0); }
  }

  // ---------- datos y arranque ----------
  function embedded() { try { return JSON.parse($("trip-embedded").textContent); } catch (e) { return null; } }
  function loadTrip() {
    if (window.APP_MODE === "pwa" && window.fetch) {
      return fetch("trip.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(embedded);
    }
    return Promise.resolve(embedded());
  }

  document.querySelectorAll("[data-letters]").forEach(letters);
  document.querySelectorAll("[data-doodle]").forEach(function (el) { var k = el.getAttribute("data-doodle"); el.innerHTML = k === "shell" ? shellSVG("#F6FF1C", 7) : DOODLES[k]; });
  document.querySelector(".brand .lettering").insertAdjacentHTML("beforeend", '<span class="shell-mini">' + shellSVG("#F6FF1C", 13) + "</span>");
  initSplash();

  loadTrip().then(function (data) {
    T = data;
    if (!T) { document.querySelector("main").innerHTML = '<p class="hint">No se han podido cargar los datos del viaje. Revisa que trip.json esté bien escrito.</p>'; return; }
    POO_DB = ((T.compartido && T.compartido.db) || "").replace(/\/+$/, "");
    renderHeader(); renderItinerario(); renderDocumentos(); renderEmergencias(); renderMapa(); renderJuegos();
    pooConnect();
    document.querySelectorAll("[data-tab]").forEach(function (t) { t.addEventListener("click", function () { showTab(t.getAttribute("data-tab"), true); }); });
    document.addEventListener("click", function (ev) { var b = ev.target.closest("[data-copy]"); if (b) { ev.preventDefault(); ev.stopPropagation(); copyText(b.getAttribute("data-copy")); } }, true);
    $("fab").addEventListener("click", function () { openGasto(null); });
    $("sheet-close").addEventListener("click", closeSheet);
    $("sheet").addEventListener("click", function (ev) { if (ev.target.id === "sheet") closeSheet(); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$("sheet").hidden) closeSheet(); });
    var start = (location.hash || "").slice(1) || store("camino-tab") || "itinerario";
    if (start === "notas") start = "mapa";
    showTab(start, false);
    if (window.__needOnb) openOnboarding();
  });
})();
</script>
